<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CMQ Bioéconomie</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --proj-color: #2563eb;
  --proj-color-2: #1d4ed8;
  --sidebar-w: 200px;
  --radius: 6px;
  --border: #e5e7eb;
  --text: #111827;
  --text-muted: #6b7280;
  --bg: #f9fafb;
  --surface: #ffffff;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); display: flex; height: 100vh; overflow: hidden; }

/* Sidebar */
#sidebar {
  width: var(--sidebar-w); background: var(--surface); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
}
#sidebar-header {
  padding: 20px 16px 12px; border-bottom: 1px solid var(--border);
}
#sidebar-proj-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
#sidebar-proj-name { font-size: 14px; font-weight: 600; color: var(--proj-color); }
#sidebar-nav { flex: 1; padding: 8px 0; }
.nav-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px; cursor: pointer;
  color: var(--text-muted); font-size: 13px; transition: background .1s, color .1s; border-radius: 0;
}
.nav-item:hover { background: var(--bg); color: var(--text); }
.nav-item.active { background: #eff6ff; color: var(--proj-color); font-weight: 500; border-right: 2px solid var(--proj-color); }
.nav-icon { width: 16px; text-align: center; font-size: 13px; }
#sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
#proj-switcher { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; background: var(--surface); cursor: pointer; }

/* Main content */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.page { display: none; flex-direction: column; height: 100%; overflow: hidden; }
.page.active { display: flex; }
.page-header {
  padding: 16px 24px; border-bottom: 1px solid var(--border); background: var(--surface);
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
}
.page-title { font-size: 16px; font-weight: 600; }
.page-body { flex: 1; overflow-y: auto; padding: 24px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: background .15s; }
.btn-primary { background: var(--proj-color); color: #fff; }
.btn-primary:hover { background: var(--proj-color-2); }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { background: var(--bg); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-group { display: flex; gap: 8px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }

/* Tables */
.data-table { width: 100%; border-collapse: collapse; }
.data-table th { text-align: left; font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
.data-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #f8fafc; }

/* Progress bar */
.progress { height: 6px; background: #e5e7eb; border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 99px; transition: width .3s; background: var(--proj-color); }
.progress-fill.warn { background: #f59e0b; }
.progress-fill.done { background: #10b981; }

/* Badge */
.badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
.badge-blue { background: #eff6ff; color: #2563eb; }
.badge-green { background: #f0fdf4; color: #16a34a; }
.badge-orange { background: #fff7ed; color: #ea580c; }
.badge-gray { background: #f3f4f6; color: #6b7280; }

/* Inputs */
input[type=text], input[type=number], input[type=date], select, textarea {
  width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 13px; font-family: var(--font); background: var(--surface); color: var(--text);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--proj-color); box-shadow: 0 0 0 2px #2563eb22; }
label { font-size: 12px; font-weight: 500; color: var(--text-muted); display: block; margin-bottom: 4px; }

/* Form layout */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-row { margin-bottom: 14px; }
.form-row.full { grid-column: 1/-1; }

/* Section groups on indicators page */
.axe-section { margin-bottom: 24px; }
.axe-header {
  display: flex; align-items: center; gap: 10px; padding: 8px 0; margin-bottom: 8px;
  cursor: pointer; user-select: none;
}
.axe-title { font-size: 13px; font-weight: 600; color: var(--text); }
.axe-count { font-size: 11px; color: var(--text-muted); }
.axe-chevron { font-size: 11px; color: var(--text-muted); transition: transform .2s; }
.axe-chevron.open { transform: rotate(90deg); }
.axe-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--proj-color); }
.sa-section { margin-left: 18px; margin-bottom: 12px; }
.sa-label { font-size: 12px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; }

/* Stats row */
.stats-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; flex: 1; min-width: 140px; }
.stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
.stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 100;
  align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 8px; padding: 24px; width: 520px; max-height: 85vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.15); }
.modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.modal-title { font-size: 15px; font-weight: 600; }
.modal-close { cursor: pointer; color: var(--text-muted); font-size: 18px; background: none; border: none; padding: 0; }

/* Steps */
.steps { display: flex; gap: 0; margin-bottom: 24px; }
.step { flex: 1; text-align: center; padding: 10px; border-bottom: 2px solid var(--border); font-size: 12px; color: var(--text-muted); }
.step.active { border-bottom-color: var(--proj-color); color: var(--proj-color); font-weight: 600; }
.step.done { border-bottom-color: #10b981; color: #10b981; }

/* Tags/chips */
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; background: #eff6ff; color: var(--proj-color); border-radius: 99px; font-size: 12px; margin: 2px; }
.chip-remove { cursor: pointer; color: var(--proj-color); font-size: 14px; line-height: 1; }

/* Toast */
#toast { position: fixed; bottom: 20px; right: 20px; z-index: 999; display: flex; flex-direction: column; gap: 8px; }
.toast-item { padding: 10px 16px; border-radius: var(--radius); font-size: 13px; background: #1f2937; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.2); animation: slide-in .2s ease; }
.toast-item.success { background: #065f46; }
.toast-item.error { background: #991b1b; }
@keyframes slide-in { from { transform: translateX(20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Map */
#map-container { flex: 1; position: relative; }
#map { height: 100%; }

/* Acueil page */
#page-accueil .page-body { display: flex; align-items: flex-start; justify-content: center; }
.proj-list { display: flex; flex-direction: column; gap: 12px; width: 480px; margin-top: 20px; }
.proj-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; cursor: pointer; transition: border-color .15s, box-shadow .15s;
  border-left: 3px solid var(--proj-color);
}
.proj-card:hover { border-color: var(--proj-color); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
.proj-card-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
.proj-card-sub { font-size: 12px; color: var(--text-muted); }
.proj-card-progress { margin-top: 12px; }
.proj-card-pct { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }

/* Filters bar */
.filters-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.filters-bar input[type=text] { width: 220px; }
.filters-bar select { width: auto; }

/* Scrollable table wrapper */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

/* Editable value cell */
.val-cell { display: flex; align-items: center; gap: 6px; }
.val-input { width: 70px; }
.val-action-name { font-size: 11px; color: var(--text-muted); }

/* Tâches */
.task-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-bottom: 1px solid var(--border); }
.task-row:last-child { border-bottom: none; }
.task-check { width: 16px; height: 16px; cursor: pointer; accent-color: var(--proj-color); flex-shrink: 0; }
.task-name { flex: 1; font-size: 13px; }
.task-name.done { text-decoration: line-through; color: var(--text-muted); }
.task-meta { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
.task-late { color: #ef4444; }
.group-header { padding: 8px 12px; background: var(--bg); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.group-header .cnt { font-weight: normal; }

/* Rapport */
.report-filters { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 20px; display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; }
.report-filters .form-row { margin-bottom: 0; }
.report-filters label { margin-bottom: 4px; }
</style>
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div id="sidebar-header">
    <div id="sidebar-proj-label">Projet actif</div>
    <div id="sidebar-proj-name">—</div>
  </div>
  <div id="sidebar-nav">
    <div class="nav-item active" data-page="indicateurs">
      <span class="nav-icon">&#9632;</span> Indicateurs
    </div>
    <div class="nav-item" data-page="actions">
      <span class="nav-icon">&#43;</span> Actions
    </div>
    <div class="nav-item" data-page="taches">
      <span class="nav-icon">&#9633;</span> Tâches
    </div>
    <div class="nav-item" data-page="carte">
      <span class="nav-icon">&#9675;</span> Carte
    </div>
    <div class="nav-item" data-page="rapport">
      <span class="nav-icon">&#9636;</span> Rapport
    </div>
  </div>
  <div id="sidebar-footer">
    <select id="proj-switcher"><option>Chargement...</option></select>
  </div>
</nav>

<!-- Main -->
<div id="main">

  <!-- Page Indicateurs -->
  <div id="page-indicateurs" class="page active">
    <div class="page-header">
      <div class="page-title">Indicateurs</div>
      <div class="btn-group">
        <button class="btn btn-outline btn-sm" onclick="exportIndicateursExcel()">Exporter Excel</button>
        <button class="btn btn-outline btn-sm" onclick="openObjectifsModal()">Objectifs</button>
      </div>
    </div>
    <div class="page-body">
      <div class="stats-row" id="indic-stats"></div>
      <div class="filters-bar" style="margin-bottom:16px">
        <input type="text" id="indic-search" placeholder="Rechercher un indicateur..." oninput="renderIndicateurs()">
        <select id="indic-axe-filter" onchange="renderIndicateurs()"><option value="">Tous les axes</option></select>
        <select id="indic-type-filter" onchange="renderIndicateurs()">
          <option value="">Tous types</option>
          <option value="Réalisation">Réalisation</option>
          <option value="Résultat">Résultat</option>
          <option value="Impact">Impact</option>
        </select>
      </div>
      <div id="indic-content"></div>
    </div>
  </div>

  <!-- Page Actions -->
  <div id="page-actions" class="page">
    <div class="page-header">
      <div class="page-title">Saisie d'une action</div>
    </div>
    <div class="page-body" style="max-width:700px;margin:0 auto">
      <div class="steps" id="action-steps">
        <div class="step active">1 · Informations</div>
        <div class="step">2 · WP / Action</div>
        <div class="step">3 · Indicateurs & participants</div>
      </div>
      <div id="action-step1">
        <div class="form-grid">
          <div class="form-row">
            <label>Date de réalisation</label>
            <input type="date" id="act-date">
          </div>
          <div class="form-row">
            <label>Responsable</label>
            <select id="act-responsable"><option value="">—</option></select>
          </div>
          <div class="form-row full">
            <label>Description (optionnel)</label>
            <textarea id="act-description" rows="2" style="width:100%;resize:vertical"></textarea>
          </div>
        </div>
        <button class="btn btn-primary" onclick="actionStep(2)">Suivant</button>
      </div>
      <div id="action-step2" style="display:none">
        <div class="form-row">
          <label>WP / Axe</label>
          <select id="act-axe" onchange="onAxeChange()"><option value="">—</option></select>
        </div>
        <div class="form-row">
          <label>Action</label>
          <select id="act-action" onchange="onActionChange()"><option value="">—</option></select>
        </div>
        <div class="form-row">
          <label>Sous-action</label>
          <select id="act-sousaction" onchange="onSAChange()"><option value="">—</option></select>
        </div>
        <div class="btn-group">
          <button class="btn btn-outline" onclick="actionStep(1)">Retour</button>
          <button class="btn btn-primary" onclick="actionStep(3)" id="step2-next" disabled>Suivant</button>
        </div>
      </div>
      <div id="action-step3" style="display:none">
        <div class="form-row">
          <label>Indicateurs réalisés</label>
          <div id="indic-inputs"></div>
        </div>
        <div class="form-row">
          <label>Établissements participants</label>
          <div style="position:relative">
            <input type="text" id="etab-search" placeholder="Rechercher par nom ou code postal..." oninput="searchEtab(this.value)" autocomplete="off">
            <div id="etab-suggestions" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);z-index:50;max-height:200px;overflow-y:auto"></div>
          </div>
          <div id="etab-chips" style="margin-top:6px"></div>
        </div>
        <div class="form-row">
          <label>Entreprises partenaires</label>
          <div style="position:relative">
            <input type="text" id="entr-search" placeholder="Rechercher une entreprise..." oninput="searchEntr(this.value)" autocomplete="off">
            <div id="entr-suggestions" style="display:none;position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);z-index:50;max-height:200px;overflow-y:auto"></div>
          </div>
          <div id="entr-chips" style="margin-top:6px"></div>
        </div>
        <div class="form-row">
          <label>Nombre de participants (optionnel)</label>
          <input type="number" id="act-nb-participants" style="width:140px" min="0">
        </div>
        <div class="btn-group" style="margin-top:16px">
          <button class="btn btn-outline" onclick="actionStep(2)">Retour</button>
          <button class="btn btn-primary" onclick="saveAction()">Enregistrer</button>
        </div>
      </div>

      <hr style="margin:32px 0;border:none;border-top:1px solid var(--border)">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div style="font-size:13px;font-weight:600">Historique des actions</div>
        <select id="hist-axe-filter" onchange="renderHistorique()" style="width:auto">
          <option value="">Tous les axes</option>
        </select>
      </div>
      <div id="actions-historique"></div>
    </div>
  </div>

  <!-- Page Tâches -->
  <div id="page-taches" class="page">
    <div class="page-header">
      <div class="page-title">Tâches</div>
      <div class="btn-group">
        <select id="tache-axe-filter" onchange="renderTaches()" style="width:auto"><option value="">Tous les axes</option></select>
        <select id="tache-statut-filter" onchange="renderTaches()" style="width:auto">
          <option value="">Tous statuts</option>
          <option value="En cours">En cours</option>
          <option value="A faire">A faire</option>
          <option value="Terminé">Terminé</option>
          <option value="En retard">En retard</option>
        </select>
        <input type="text" id="tache-search" placeholder="Rechercher..." oninput="renderTaches()" style="width:180px">
      </div>
    </div>
    <div class="page-body" style="padding:0">
      <div id="taches-content"></div>
    </div>
  </div>

  <!-- Page Carte -->
  <div id="page-carte" class="page">
    <div class="page-header">
      <div class="page-title">Carte des établissements</div>
      <div class="btn-group">
        <select id="map-axe-filter" onchange="updateMap()" style="width:auto"><option value="">Tous les axes</option></select>
      </div>
    </div>
    <div id="map-container"><div id="map"></div></div>
  </div>

  <!-- Page Rapport -->
  <div id="page-rapport" class="page">
    <div class="page-header">
      <div class="page-title">Rapport</div>
      <div class="btn-group">
        <button class="btn btn-outline btn-sm" onclick="exportRapportExcel()">Exporter Excel</button>
        <button class="btn btn-outline btn-sm" onclick="exportRapportPDF()">Exporter PDF</button>
      </div>
    </div>
    <div class="page-body">
      <div class="report-filters">
        <div class="form-row">
          <label>Année</label>
          <select id="rap-annee" onchange="renderRapport()">
            <option value="">Toutes</option>
            <option value="2024">2024</option>
            <option value="2025">2025</option>
            <option value="2026">2026</option>
          </select>
        </div>
        <div class="form-row">
          <label>Axe / WP</label>
          <select id="rap-axe" onchange="renderRapport()"><option value="">Tous</option></select>
        </div>
        <div class="form-row">
          <label>Responsable</label>
          <select id="rap-membre" onchange="renderRapport()"><option value="">Tous</option></select>
        </div>
      </div>
      <div id="rapport-content"></div>
    </div>
  </div>

</div><!-- /main -->

<!-- Modal saisie valeur indicateur -->
<div class="modal-overlay" id="modal-indic">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-indic-title">Saisir une valeur</div>
      <button class="modal-close" onclick="closeModal('modal-indic')">&times;</button>
    </div>
    <div class="form-row">
      <label>Action réalisée associée</label>
      <select id="modal-action-ref" style="width:100%"><option value="">—</option></select>
    </div>
    <div class="form-row">
      <label>Valeur</label>
      <input type="number" id="modal-indic-val" style="width:160px" min="0">
    </div>
    <div class="form-row">
      <label>Date</label>
      <input type="date" id="modal-indic-date">
    </div>
    <div class="btn-group" style="margin-top:16px">
      <button class="btn btn-outline" onclick="closeModal('modal-indic')">Annuler</button>
      <button class="btn btn-primary" onclick="saveIndicValeur()">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Modal objectifs -->
<div class="modal-overlay" id="modal-objectifs">
  <div class="modal" style="width:600px">
    <div class="modal-header">
      <div class="modal-title">Objectifs du projet</div>
      <button class="modal-close" onclick="closeModal('modal-objectifs')">&times;</button>
    </div>
    <div id="objectifs-form"></div>
    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-outline" onclick="closeModal('modal-objectifs')">Fermer</button>
      <button class="btn btn-primary" onclick="saveObjectifs()">Enregistrer les objectifs</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const TABLES = {
  PROJETS:      'PROJET_projet',
  AXES:         'PROJET_axes',
  MEMBRES:      'CMQ_RH',
  ACTIONS:      'PROJET_Actions',
  SOUS_ACTIONS: 'PROJET_sous_actions',
  INDIC_CONFIG: 'CONFIG_liste_des_indicateurs_par_action',
  INDIC_VAL:    'SUIVI_indicateurs',
  ACTIONS_REAL: 'SAISIE_actions_realisees',
  ETAB_PARTS:   'SAISIE_etablissements_participants_par_action',
  ENTREPRISES:  'CONFIG_entreprises_partenaires',
  ENTR_PARTS:   'SAISIE_entreprises_par_action',
  TACHES:       'SUIVI_TACHES_ALL',
  ETABLISSEMENTS: 'CONFIG_liste_des_etablissements_RGE',
};

// ── State ──────────────────────────────────────────────────────────────────
let DATA = {};
let currentProj = null;
let allEtab = null;
let leafletMap = null;
let currentIndicEditId = null;
let currentIndicEditSAId = null;
let selectedEtabs = [];
let selectedEntrs = [];
let objectifs = {};

// ── Grist init ─────────────────────────────────────────────────────────────
grist.ready({ requiredAccess: 'full' });
grist.onRecord && grist.onRecord(() => {});

window.addEventListener('DOMContentLoaded', async () => {
  await loadAll();
  initNav();
  initProjSwitcher();

// ── Data loading ───────────────────────────────────────────────────────────
function tableToObjects(t) {
  if (!t || !t.id) return [];
  const ids = t.id;
  const cols = t;
  return ids.map((id, i) => {
    const obj = { id };
    Object.keys(cols).forEach(k => { if (k !== 'id') obj[k] = cols[k][i]; });
    return obj;
  });
}

async function fetchTable(name) {
  try {
    const t = await grist.docApi.fetchTable(name);
    return tableToObjects(t);
  } catch(e) {
    return [];
  }
}

async function loadAll() {
  const [projets, axes, membres, actions, sousActions, indicConfig, indicVal, actReal, etabParts, entreprises, entrParts, taches] = await Promise.all([
    fetchTable(TABLES.PROJETS),
    fetchTable(TABLES.AXES),
    fetchTable(TABLES.MEMBRES),
    fetchTable(TABLES.ACTIONS),
    fetchTable(TABLES.SOUS_ACTIONS),
    fetchTable(TABLES.INDIC_CONFIG),
    fetchTable(TABLES.INDIC_VAL),
    fetchTable(TABLES.ACTIONS_REAL),
    fetchTable(TABLES.ETAB_PARTS),
    fetchTable(TABLES.ENTREPRISES),
    fetchTable(TABLES.ENTR_PARTS),
    fetchTable(TABLES.TACHES),
  ]);

  DATA = { projets, axes, membres, actions, sousActions, indicConfig, indicVal, actReal, etabParts, entreprises, entrParts, taches };

  if (projets.length === 0) {
    loadDemo();
    return;
  }

  // Default to first project
  currentProj = projets[0];
  loadObjectifs();
}

function showPage(name) {

function loadObjectifs() {

// ── Indicateurs page ───────────────────────────────────────────────────────
function getProjAxes() {
  if (!currentProj) return [];
  return DATA.axes.filter(a => a.projet_ref === currentProj.id || a.projet_ref === currentProj.cod_projet);
}

function getProjIndicateurs() {
  const projAxes = getProjAxes();
  const axeIds = projAxes.map(a => a.id);
  // sous-actions belonging to this project's axes
  const projSA = DATA.sousActions.filter(sa => {
    const act = DATA.actions.find(a => a.id === sa.action_ref);
    if (!act) return false;
    return axeIds.includes(act.wp_axe_ref);
  });
  const saIds = projSA.map(sa => sa.id);
  return DATA.indicConfig.filter(ind => saIds.includes(ind.type_sous_action));
}

function getIndicValeur(indicId) {
  return DATA.indicVal
    .filter(v => v.indicateur_ref === indicId || v.indicateur_id === indicId)
    .reduce((s, v) => s + (parseFloat(v.valeur) || 0), 0);
}

function renderIndicateurs() {
  if (!currentProj) return;
  const search = (document.getElementById('indic-search')?.value || '').toLowerCase();
  const axeFilter = document.getElementById('indic-axe-filter')?.value || '';
  const typeFilter = document.getElementById('indic-type-filter')?.value || '';

  const projAxes = getProjAxes();
  const axeIds = projAxes.map(a => a.id);

  // Populate axe filter
  const axeSel = document.getElementById('indic-axe-filter');
  if (axeSel && axeSel.options.length === 1) {
    projAxes.forEach(a => {
      const o = document.createElement('option');
      o.value = a.id;
      o.textContent = `${a.cod_axe} — ${a.lib_axe}`;
      axeSel.appendChild(o);
    });
  }

  // Build stats
  let totalIndics = 0, withVal = 0, withObj = 0;
  const content = document.getElementById('indic-content');

  let html = '';

  const axesToShow = axeFilter ? projAxes.filter(a => a.id == axeFilter) : projAxes;

  axesToShow.forEach(axe => {
    // Get actions for this axe
    const axeActions = DATA.actions.filter(a => a.wp_axe_ref === axe.id);
    const saForAxe = DATA.sousActions.filter(sa => axeActions.some(a => a.id === sa.action_ref));
    const indicsForAxe = DATA.indicConfig.filter(ind => {
      const match = saForAxe.some(sa => sa.id === ind.type_sous_action);
      if (!match) return false;
      if (typeFilter && ind.Code_indicateur !== typeFilter) return false;
      if (search && !ind.libelle_indicateurs?.toLowerCase().includes(search)) return false;
      return true;
    });

    if (indicsForAxe.length === 0) return;

    totalIndics += indicsForAxe.length;
    indicsForAxe.forEach(ind => {
      const val = getIndicValeur(ind.id);
      if (val > 0) withVal++;
      if (objectifs[ind.id] > 0) withObj++;
    });

    // Group by sous-action
    const bySA = {};
    indicsForAxe.forEach(ind => {
      const saId = ind.type_sous_action;
      if (!bySA[saId]) bySA[saId] = [];
      bySA[saId].push(ind);
    });

    html += `<div class="axe-section">
      <div class="axe-header" onclick="toggleAxeSection(this)">
        <span class="axe-dot"></span>
        <span class="axe-title">${axe.cod_axe} — ${axe.lib_axe}</span>
        <span class="axe-count">${indicsForAxe.length} indicateurs</span>
        <span class="axe-chevron open">&#9658;</span>
      </div>
      <div class="axe-body">`;

    Object.entries(bySA).forEach(([saId, inds]) => {
      const sa = DATA.sousActions.find(s => s.id == saId);
      const saLabel = sa ? (sa.lib_sous_action || sa.cod_sous_action) : `SA ${saId}`;
      html += `<div class="sa-section">
        <div class="sa-label">${saLabel}</div>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr>
              <th style="width:40%">Indicateur</th>
              <th style="width:10%">Type</th>
              <th style="width:12%">Valeur</th>
              <th style="width:14%">Objectif</th>
              <th style="width:24%">Progression</th>
            </tr></thead>
            <tbody>`;

      inds.forEach(ind => {
        const val = getIndicValeur(ind.id);
        const obj = parseFloat(objectifs[ind.id]) || 0;
        const pct = obj > 0 ? Math.min(100, Math.round(val / obj * 100)) : 0;
        const fillClass = pct >= 100 ? 'done' : pct >= 50 ? '' : 'warn';
        const typeCode = ind.Code_indicateur || '';
        const typeBadge = typeCode.startsWith('R') ? 'badge-orange' : typeCode.startsWith('Im') ? 'badge-blue' : 'badge-gray';

        html += `<tr>
          <td>${ind.libelle_indicateurs || '—'}</td>
          <td><span class="badge ${typeBadge}">${typeCode}</span></td>
          <td>
            <a href="#" onclick="editIndicValeur(${ind.id},${saId});return false" style="color:var(--proj-color);text-decoration:none;font-weight:600">${val > 0 ? val : '+'}</a>
            ${ind.type_valeur ? `<span style="font-size:10px;color:var(--text-muted);margin-left:3px">${ind.type_valeur}</span>` : ''}
          </td>
          <td>
            <input type="number" class="val-input" data-obj-id="${ind.id}" value="${objectifs[ind.id] || ''}" min="0"
              onblur="quickSaveObj(${ind.id},this.value)" style="width:80px">
          </td>
          <td>
            ${obj > 0 ? `
              <div style="display:flex;align-items:center;gap:8px">
                <div class="progress" style="flex:1"><div class="progress-fill ${fillClass}" style="width:${pct}%"></div></div>
                <span style="font-size:11px;color:var(--text-muted);width:32px;text-align:right">${pct}%</span>
              </div>` : '<span style="font-size:11px;color:var(--text-muted)">—</span>'}
          </td>
        </tr>`;
      });

      html += `</tbody></table></div></div>`;
    });

    html += `</div></div>`;
  });

  if (!html) html = `<div style="text-align:center;padding:40px;color:var(--text-muted)">Aucun indicateur pour ce projet.</div>`;

  content.innerHTML = html;

  // Stats
  document.getElementById('indic-stats').innerHTML = `
    <div class="stat-card"><div class="stat-value">${totalIndics}</div><div class="stat-label">Indicateurs</div></div>
    <div class="stat-card"><div class="stat-value">${withVal}</div><div class="stat-label">Avec valeur saisie</div></div>
    <div class="stat-card"><div class="stat-value">${withObj}</div><div class="stat-label">Avec objectif défini</div></div>
    <div class="stat-card"><div class="stat-value">${totalIndics > 0 ? Math.round(withVal/totalIndics*100) : 0}%</div><div class="stat-label">Taux de saisie</div></div>
  `;
}

function toggleAxeSection(header) {
  const body = header.nextElementSibling;
  const chevron = header.querySelector('.axe-chevron');
  if (body.style.display === 'none') {
    body.style.display = '';
    chevron.classList.add('open');
  } else {
    body.style.display = 'none';
    chevron.classList.remove('open');
  }
}

function quickSaveObj(indicId, value) {
  const val = parseFloat(value);
  if (!isNaN(val) && val > 0) objectifs[indicId] = val;
  else delete objectifs[indicId];
  const key = `cmq_objectifs_v2_${currentProj?.cod_projet}`;
  localStorage.setItem(key, JSON.stringify(objectifs));
  renderIndicateurs();
}

async function searchEtab(query) {

    sugg.innerHTML = '<div style="padding:8px;font-size:12px;color:var(--text-muted)">Chargement...</div>';

async function saveAction() {
  const saId = parseInt(document.getElementById('act-sousaction').value);
  if (!saId) { showToast('Sélectionnez une sous-action', 'error'); return; }
  const date = document.getElementById('act-date').value;
  const memId = document.getElementById('act-responsable').value;
  const desc = document.getElementById('act-description').value;
  const nbPart = parseInt(document.getElementById('act-nb-participants').value) || 0;

  const sa = DATA.sousActions.find(s => s.id === saId);
  const action = DATA.actions.find(a => a.id === sa?.action_ref);
  const axe = DATA.axes.find(a => a.id === action?.wp_axe_ref);

  const actRecord = {
    sous_action_ref: saId,
    date_realisation: date,
    description: desc,
    nb_participants: nbPart || null,
    projet_ref: currentProj?.id,
  };
  if (memId) actRecord.responsable_ref = parseInt(memId);

  try {
    const result = await grist.docApi.applyUserActions([['AddRecord', TABLES.ACTIONS_REAL, null, actRecord]]);
    const newActId = result[0];

    // Save indicateur values
    const indicInputs = document.querySelectorAll('#indic-inputs input[data-indic-id]');
    const indicActions = [];
    indicInputs.forEach(inp => {
      const val = parseFloat(inp.value);
      if (!isNaN(val) && val > 0) {
        indicActions.push(['AddRecord', TABLES.INDIC_VAL, null, {
          indicateur_ref: parseInt(inp.dataset.indicId),
          valeur: val,
          date_saisie: date,
          action_realisee_ref: newActId,
        }]);
      }
    });
    if (indicActions.length) {
      await grist.docApi.applyUserActions(indicActions);
      indicActions.forEach(a => DATA.indicVal.push({ id: Date.now(), ...a[3] }));
    }

    // Save établissements
    if (selectedEtabs.length) {
      const etabActions = selectedEtabs.map(e => ['AddRecord', TABLES.ETAB_PARTS, null, {
        action_realisee_ref: newActId,
        etablissement_ref: e.id,
      }]);
      await grist.docApi.applyUserActions(etabActions);
    }

    // Save entreprises
    if (selectedEntrs.length) {
      const entrActions = selectedEntrs.map(e => ['AddRecord', TABLES.ENTR_PARTS, null, {
        action_realisee_ref: newActId,
        entreprise_ref: e.id,
      }]);
      await grist.docApi.applyUserActions(entrActions);
    }

    DATA.actReal.push({ id: newActId, ...actRecord, lib_sous_action: sa?.lib_sous_action });
    showToast('Action enregistrée');
    initActionsPage();
  } catch(e) {
    showToast('Erreur : ' + e.message, 'error');
  }
}

function renderHistorique() {
  const histAxe = document.getElementById('hist-axe-filter')?.value || '';
  const projActReal = DATA.actReal.filter(a => {
    const match = !currentProj || a.projet_ref === currentProj.id || a.projet_ref === currentProj.cod_projet;
    if (!match) return false;
    if (histAxe) {
      const sa = DATA.sousActions.find(s => s.id === a.sous_action_ref);
      const act = DATA.actions.find(ac => ac.id === sa?.action_ref);
      if (act?.wp_axe_ref != histAxe) return false;
    }
    return true;
  }).slice().reverse().slice(0, 20);

  const el = document.getElementById('actions-historique');
  if (projActReal.length === 0) {
    el.innerHTML = '<div style="font-size:12px;color:var(--text-muted)">Aucune action enregistrée.</div>';
    return;
  }

  el.innerHTML = `<div class="table-wrap"><table class="data-table">
    <thead><tr><th>Date</th><th>Sous-action</th><th>Participants</th><th>Indicateurs</th><th>Établissements</th></tr></thead>
    <tbody>
    ${projActReal.map(a => {
      const sa = DATA.sousActions.find(s => s.id === a.sous_action_ref);
      const indicsForAct = DATA.indicVal.filter(v => v.action_realisee_ref === a.id);
      const etabsForAct = DATA.etabParts.filter(e => e.action_realisee_ref === a.id);
      return `<tr>
        <td>${a.date_realisation || '—'}</td>
        <td>${sa?.lib_sous_action || sa?.cod_sous_action || '—'}</td>
        <td>${a.nb_participants || '—'}</td>
        <td>${indicsForAct.length > 0 ? indicsForAct.map(v => `<span class="badge badge-blue">${v.valeur}</span>`).join(' ') : '—'}</td>
        <td>${etabsForAct.length > 0 ? `<span class="badge badge-gray">${etabsForAct.length} étab.</span>` : '—'}</td>
      </tr>`;
    }).join('')}
    </tbody></table></div>`;
}

// ── Tâches page ────────────────────────────────────────────────────────────
function renderTaches() {
  if (!currentProj) return;
  const search = document.getElementById('tache-search')?.value.toLowerCase() || '';
  const axeFilter = document.getElementById('tache-axe-filter')?.value || '';
  const statutFilter = document.getElementById('tache-statut-filter')?.value || '';
  const today = new Date().toISOString().slice(0,10);

  // Populate tache-axe-filter
  const projAxes = getProjAxes();
  const sel = document.getElementById('tache-axe-filter');
  if (sel && sel.options.length === 1) {
    projAxes.forEach(a => {
      const o = document.createElement('option');
      o.value = a.id;
      o.textContent = a.cod_axe;
      sel.appendChild(o);
    });
  }

  const projTaches = DATA.taches.filter(t => {
    const matchProj = !currentProj || t.projet_ref === currentProj.id || t.projet_ref === currentProj.cod_projet;
    const matchSearch = !search || (t.titre || t.nom_tache || '').toLowerCase().includes(search);
    const matchStatut = !statutFilter || t.statut === statutFilter;
    const matchAxe = !axeFilter || t.axe_ref == axeFilter || t.wp_ref == axeFilter;
    return matchProj && matchSearch && matchStatut && matchAxe;
  });

  // Group by axe
  const byAxe = {};
  projTaches.forEach(t => {
    const key = t.axe_ref || t.wp_ref || 0;
    if (!byAxe[key]) byAxe[key] = [];
    byAxe[key].push(t);
  });

  const el = document.getElementById('taches-content');
  if (projTaches.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)">Aucune tâche.</div>';
    return;
  }

  let html = '';
  Object.entries(byAxe).forEach(([axeId, tasks]) => {
    const axe = DATA.axes.find(a => a.id == axeId);
    const done = tasks.filter(t => t.statut === 'Terminé').length;
    html += `<div class="group-header">
      <span>${axe ? `${axe.cod_axe} — ${axe.lib_axe}` : 'Sans axe'}</span>
      <span class="cnt">${done}/${tasks.length} terminées</span>
    </div>`;
    tasks.forEach(t => {
      const titre = t.titre || t.nom_tache || 'Tâche sans titre';
      const isDone = t.statut === 'Terminé';
      const isLate = !isDone && t.date_echeance && t.date_echeance < today;
      const resp = DATA.membres.find(m => m.id === t.responsable_ref);
      html += `<div class="task-row">
        <input type="checkbox" class="task-check" ${isDone ? 'checked' : ''} onchange="toggleTache(${t.id},this.checked)">
        <div class="task-name ${isDone ? 'done' : ''}">${titre}</div>
        <div class="task-meta ${isLate ? 'task-late' : ''}">
          ${resp ? resp.Membre + ' · ' : ''}${t.date_echeance || ''}${isLate ? ' (retard)' : ''}
        </div>
      </div>`;
    });
  });

  el.innerHTML = html;
}

async function toggleTache(id, done) {
  try {
    await grist.docApi.applyUserActions([['UpdateRecord', TABLES.TACHES, id, { statut: done ? 'Terminé' : 'En cours' }]]);
    const t = DATA.taches.find(t => t.id === id);
    if (t) t.statut = done ? 'Terminé' : 'En cours';
  } catch(e) {
    showToast('Erreur mise à jour', 'error');
  }
}

// ── Carte ──────────────────────────────────────────────────────────────────
async function initMap() {
  if (!leafletMap) {
    leafletMap = L.map('map').setView([46.5, 2.3], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(leafletMap);
  }
  updateMap();
}

async function updateMap() {
  if (!leafletMap) return;
  leafletMap.eachLayer(l => { if (l instanceof L.Marker || l instanceof L.CircleMarker) leafletMap.removeLayer(l); });

  // Load etabs if not loaded
  if (!allEtab) allEtab = await fetchTable(TABLES.ETABLISSEMENTS);

  const axeFilter = document.getElementById('map-axe-filter')?.value;
  const mapAxeSel = document.getElementById('map-axe-filter');
  if (mapAxeSel && mapAxeSel.options.length === 1) {
    getProjAxes().forEach(a => {
      const o = document.createElement('option');
      o.value = a.id; o.textContent = a.cod_axe;
      mapAxeSel.appendChild(o);
    });
  }

  // Get all etab_parts for current project
  const projActReal = DATA.actReal.filter(a => !currentProj || a.projet_ref === currentProj.id);
  const actRealIds = new Set(projActReal.map(a => a.id));
  const touchedEtabIds = new Set(DATA.etabParts.filter(ep => actRealIds.has(ep.action_realisee_ref)).map(ep => ep.etablissement_ref));

  // Count per etab
  const countPerEtab = {};
  DATA.etabParts.filter(ep => actRealIds.has(ep.action_realisee_ref)).forEach(ep => {
    countPerEtab[ep.etablissement_ref] = (countPerEtab[ep.etablissement_ref] || 0) + 1;
  });

  let placed = 0;
  allEtab.forEach(e => {
    if (!touchedEtabIds.has(e.id)) return;
    const lat = parseFloat(e.latitude || e.lat);
    const lon = parseFloat(e.longitude || e.lon || e.lng);
    if (!lat || !lon) return;

    const cnt = countPerEtab[e.id] || 1;
    const r = Math.min(18, 6 + cnt * 2);
    L.circleMarker([lat, lon], {
      radius: r, fillColor: currentProj?.couleur || '#2563eb',
      color: '#fff', weight: 1.5, fillOpacity: .75
    }).bindPopup(`<strong>${e.nom_etab || '—'}</strong><br>${e.commune || ''} ${e.code_postal || ''}<br>${cnt} action(s)`).addTo(leafletMap);
    placed++;
  });

  if (placed === 0) {
    L.popup().setLatLng([46.5, 2.3]).setContent('Aucun établissement localisé pour ce projet.').openOn(leafletMap);
  }
}

// ── Rapport ────────────────────────────────────────────────────────────────
function renderRapport() {
  const annee = document.getElementById('rap-annee')?.value || '';
  const axeFilter = document.getElementById('rap-axe')?.value || '';
  const memFilter = document.getElementById('rap-membre')?.value || '';

  // Populate filters
  const rapAxeSel = document.getElementById('rap-axe');
  if (rapAxeSel && rapAxeSel.options.length === 1) {
    getProjAxes().forEach(a => {
      const o = document.createElement('option');
      o.value = a.id; o.textContent = a.cod_axe;
      rapAxeSel.appendChild(o);
    });
  }
  const rapMemSel = document.getElementById('rap-membre');
  if (rapMemSel && rapMemSel.options.length === 1) {
    DATA.membres.filter(m => !currentProj || m.projet_ref === currentProj.id).forEach(m => {
      const o = document.createElement('option');
      o.value = m.id; o.textContent = m.Membre;
      rapMemSel.appendChild(o);
    });
  }

  // Filter actions
  const filtered = DATA.actReal.filter(a => {
    if (currentProj && a.projet_ref !== currentProj.id) return false;
    if (annee && a.date_realisation && !a.date_realisation.startsWith(annee)) return false;
    if (memFilter && a.responsable_ref != memFilter) return false;
    if (axeFilter) {
      const sa = DATA.sousActions.find(s => s.id === a.sous_action_ref);
      const act = DATA.actions.find(ac => ac.id === sa?.action_ref);
      if (act?.wp_axe_ref != axeFilter) return false;
    }
    return true;
  });

  // Indicateur summary
  const indicSummary = {};
  DATA.indicVal.forEach(v => {
    const actReal = DATA.actReal.find(a => a.id === v.action_realisee_ref);
    if (actReal && filtered.some(a => a.id === actReal.id)) {
      indicSummary[v.indicateur_ref] = (indicSummary[v.indicateur_ref] || 0) + (parseFloat(v.valeur) || 0);
    }
  });

  const el = document.getElementById('rapport-content');

  // Stats
  const totalPart = filtered.reduce((s, a) => s + (a.nb_participants || 0), 0);
  const totalEtabs = new Set(DATA.etabParts.filter(ep => filtered.some(a => a.id === ep.action_realisee_ref)).map(ep => ep.etablissement_ref)).size;

  el.innerHTML = `
    <div class="stats-row" style="margin-bottom:20px">
      <div class="stat-card"><div class="stat-value">${filtered.length}</div><div class="stat-label">Actions réalisées</div></div>
      <div class="stat-card"><div class="stat-value">${totalPart}</div><div class="stat-label">Participants</div></div>
      <div class="stat-card"><div class="stat-value">${totalEtabs}</div><div class="stat-label">Établissements touchés</div></div>
      <div class="stat-card"><div class="stat-value">${Object.keys(indicSummary).length}</div><div class="stat-label">Indicateurs renseignés</div></div>
    </div>
    <div class="table-wrap" style="margin-bottom:20px">
      <table class="data-table">
        <thead><tr><th>Date</th><th>Sous-action</th><th>Axe</th><th>Responsable</th><th>Participants</th><th>Établissements</th></tr></thead>
        <tbody>
        ${filtered.length === 0 ? `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:20px">Aucune action.</td></tr>` :
          filtered.map(a => {
            const sa = DATA.sousActions.find(s => s.id === a.sous_action_ref);
            const act = DATA.actions.find(ac => ac.id === sa?.action_ref);
            const axe = DATA.axes.find(ax => ax.id === act?.wp_axe_ref);
            const resp = DATA.membres.find(m => m.id === a.responsable_ref);
            const etabCnt = DATA.etabParts.filter(ep => ep.action_realisee_ref === a.id).length;
            return `<tr>
              <td>${a.date_realisation || '—'}</td>
              <td>${sa?.lib_sous_action || sa?.cod_sous_action || '—'}</td>
              <td>${axe?.cod_axe || '—'}</td>
              <td>${resp?.Membre || '—'}</td>
              <td>${a.nb_participants || '—'}</td>
              <td>${etabCnt || '—'}</td>
            </tr>`;
          }).join('')
        }
        </tbody>
      </table>
    </div>
    ${Object.keys(indicSummary).length > 0 ? `
      <div style="font-size:13px;font-weight:600;margin-bottom:10px">Résumé indicateurs</div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Indicateur</th><th>Type</th><th>Valeur totale</th><th>Objectif</th></tr></thead>
          <tbody>
          ${Object.entries(indicSummary).map(([indicId, val]) => {
            const ind = DATA.indicConfig.find(i => i.id == indicId);
            const obj = objectifs[indicId] || 0;
            return `<tr>
              <td>${ind?.libelle_indicateurs || '—'}</td>
              <td>${ind?.Code_indicateur || '—'}</td>
              <td><strong>${val}</strong> ${ind?.type_valeur || ''}</td>
              <td>${obj || '—'}</td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
      </div>` : ''}
  `;
}

// ── Exports ────────────────────────────────────────────────────────────────
function exportIndicateursExcel() {
  if (!currentProj) return;
  const projAxes = getProjAxes();
  const rows = [['Axe', 'Sous-action', 'Indicateur', 'Type', 'Valeur réalisée', 'Objectif', '% atteint']];

  projAxes.forEach(axe => {
    const axeActions = DATA.actions.filter(a => a.wp_axe_ref === axe.id);
    const sas = DATA.sousActions.filter(sa => axeActions.some(a => a.id === sa.action_ref));
    sas.forEach(sa => {
      const indics = DATA.indicConfig.filter(i => i.type_sous_action === sa.id);
      indics.forEach(ind => {
        const val = getIndicValeur(ind.id);
        const obj = objectifs[ind.id] || 0;
        const pct = obj > 0 ? Math.round(val / obj * 100) : '';
        rows.push([axe.cod_axe, sa.lib_sous_action || sa.cod_sous_action, ind.libelle_indicateurs, ind.Code_indicateur, val, obj || '', pct]);
      });
    });
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Indicateurs');
  XLSX.writeFile(wb, `indicateurs_${currentProj.cod_projet}_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Export Excel téléchargé');
}

function exportRapportExcel() {
  const annee = document.getElementById('rap-annee')?.value || '';
  const filtered = DATA.actReal.filter(a => {
    if (currentProj && a.projet_ref !== currentProj.id) return false;
    if (annee && a.date_realisation && !a.date_realisation.startsWith(annee)) return false;
    return true;
  });

  const rows = [['Date', 'Axe', 'Sous-action', 'Responsable', 'Participants', 'Établissements', 'Description']];
  filtered.forEach(a => {
    const sa = DATA.sousActions.find(s => s.id === a.sous_action_ref);
    const act = DATA.actions.find(ac => ac.id === sa?.action_ref);
    const axe = DATA.axes.find(ax => ax.id === act?.wp_axe_ref);
    const resp = DATA.membres.find(m => m.id === a.responsable_ref);
    const etabCnt = DATA.etabParts.filter(ep => ep.action_realisee_ref === a.id).length;
    rows.push([a.date_realisation, axe?.cod_axe, sa?.lib_sous_action, resp?.Membre, a.nb_participants, etabCnt, a.description]);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Actions');
  XLSX.writeFile(wb, `rapport_${currentProj?.cod_projet || 'cmq'}_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('Export Excel téléchargé');
}

function exportRapportPDF() {
  window.print();
}

// ── Modal helpers ──────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeAllModals() { document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open')); }

// ── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.textContent = msg;
  document.getElementById('toast').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
